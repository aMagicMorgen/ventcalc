name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📂 List files (debug)
        run: ls -la
        # 👆 Это покажет, что лежит в корне

      - name: ⚙️ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🎯 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: 📦 Get dependencies
        run: |
          ls -la
          cd vent_calc || exit 1
          flutter pub get
        # 👆 Пытаемся зайти в папку vent_calc

      - name: 🔨 Build APK
        run: |
          cd vent_calc || exit 1
          flutter build apk --release

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: vent_calc/build/app/outputs/flutter-apk/app-release.apk

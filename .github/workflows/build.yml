name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [android-arm64, android-arm, android-x64]
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v3
    
    - name: ⚙️ Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'
    
    - name: 🎯 Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'
    
    - name: 📦 Get dependencies
      run: flutter pub get
    
    - name: 🔨 Build APK for ${{ matrix.arch }}
      run: flutter build apk --release --target-platform ${{ matrix.arch }}
    
    - name: 📤 Upload APK for ${{ matrix.arch }}
      uses: actions/upload-artifact@v3
      with:
        name: app-${{ matrix.arch }}
        path: build/app/outputs/flutter-apk/app-${{ matrix.arch }}-release.apk
